name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build per il dominio ufficiale
        run: npm run build
        env:
          GITHUB_PAGES: 'false'
          PUBLIC_NOINDEX: 'false'
          PUBLIC_GA_ID: 'G-TWW2KT072T'
      - name: Verifica consenso Analytics
        run: node scripts/check-analytics.mjs
      - name: Verifica metadati e immagine social
        run: node scripts/check-metadata.mjs "https://www.traspogru.it/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
